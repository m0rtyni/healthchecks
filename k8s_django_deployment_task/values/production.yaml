config:
  allowedHosts: "localhost,127.0.0.1,healthchecks.local,healthchecks,healthchecks.default,healthchecks.default.svc,healthchecks.default.svc.cluster.local"
  dbHost: "healthchecks-postgres.czs0igou26lz.eu-central-1.rds.amazonaws.com"
  siteRoot: "http://localhost:8080"

image:
  repository: "014468369410.dkr.ecr.eu-central-1.amazonaws.com/healthchecks"
  tag: eks
  pullPolicy: IfNotPresent

ingress:
  enabled: false
  className: nginx
  host: "localhost"
  tls:
    enabled: false
    secretName: healthchecks-tls
    clusterIssuer: letsencrypt-prod

certManager:
  enabled: false
  email: ""
  server: https://acme-v02.api.letsencrypt.org/directory
