apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-connection"
  labels:
    app.kubernetes.io/name: healthchecks
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          wget -S -O /dev/null -T 10 --header="Host: healthchecks.local" http://healthchecks:8080/
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

