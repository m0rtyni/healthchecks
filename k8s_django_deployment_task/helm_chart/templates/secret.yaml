apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
type: Opaque
stringData:
  DB_PASSWORD: {{ required "Set secret.dbPassword when installing the chart" .Values.secret.dbPassword | quote }}
  SECRET_KEY: {{ required "Set secret.djangoSecretKey when installing the chart" .Values.secret.djangoSecretKey | quote }}
