apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "Set secret.dbPassword for the PostgreSQL release" .Values.secret.dbPassword | quote }}
