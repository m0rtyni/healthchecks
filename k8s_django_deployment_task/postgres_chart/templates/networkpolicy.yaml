apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres-ingress
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: healthchecks-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: healthchecks-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: healthchecks
      ports:
        - protocol: TCP
          port: 5432
